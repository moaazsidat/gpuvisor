<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPUvisor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>GPUvisor</h1>
      <div class="header-meta" id="driver-info"></div>
      <button class="icon-btn" id="settings-toggle" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <main id="gpu-list"></main>

    <div id="settings-panel" class="hidden">
      <h2>Settings</h2>
      <div class="setting-group">
        <label>Inline Metrics</label>
        <div class="checkbox-group">
          <label><input type="checkbox" value="utilization" checked> Utilization</label>
          <label><input type="checkbox" value="temperature"> Temperature</label>
          <label><input type="checkbox" value="fan_speed"> Fan Speed</label>
          <label><input type="checkbox" value="memory_usage"> Memory</label>
          <label><input type="checkbox" value="power_usage"> Power</label>
        </div>
      </div>
      <div class="setting-group">
        <label>Multi-GPU Display</label>
        <div class="btn-group" id="gpu-mode">
          <button class="btn-option active" data-value="all">All GPUs</button>
          <button class="btn-option" data-value="aggregate">Aggregate</button>
          <button class="btn-option" data-value="single">Single GPU</button>
        </div>
      </div>
      <div class="setting-group hidden" id="single-gpu-select">
        <label>Select GPU</label>
        <div class="btn-group" id="gpu-index"></div>
      </div>
      <div class="setting-group">
        <label>Temperature Unit</label>
        <div class="btn-group" id="temp-unit">
          <button class="btn-option active" data-value="c">Celsius</button>
          <button class="btn-option" data-value="f">Fahrenheit</button>
        </div>
      </div>
      <div class="setting-group">
        <label>Poll Interval</label>
        <div class="btn-group" id="poll-interval">
          <button class="btn-option" data-value="500">500ms</button>
          <button class="btn-option active" data-value="1000">1s</button>
          <button class="btn-option" data-value="2000">2s</button>
          <button class="btn-option" data-value="5000">5s</button>
        </div>
      </div>
      <button class="btn-save" id="save-settings">Save Settings</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
